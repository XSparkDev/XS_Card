buildscript {
    ext {
        buildToolsVersion = findProperty('android.buildToolsVersion') ?: '35.0.0'
        minSdkVersion = Integer.parseInt(findProperty('android.minSdkVersion') ?: '24')
        compileSdkVersion = Integer.parseInt(findProperty('android.compileSdkVersion') ?: '35')
        targetSdkVersion = Integer.parseInt(findProperty('android.targetSdkVersion') ?: '35')
        // Commented out to avoid NDK license issue - will use default NDK if needed
        // ndkVersion = "28.0.12674087"
        kotlinVersion = findProperty('android.kotlinVersion') ?: '1.9.25'

        if (findProperty('android.kotlinVersion')) {
            kotlinVersion = findProperty('android.kotlinVersion')
        }
        frescoVersion = findProperty('expo.frescoVersion') ?: '3.1.3'
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath('com.android.tools.build:gradle:8.6.0')
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
    }
}

// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
    id "com.facebook.react.rootproject"
}

allprojects {
    repositories {
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            url(new File(['node', '--print', "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim(), '../android'))
        }
        maven {
            // Android JSC is installed from npm
            url(new File(['node', '--print', "require.resolve('jsc-android/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim(), '../dist'))
        }

        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
    }
}

// Ensure BuildConfig is generated for all Android modules that define custom BuildConfig fields
subprojects { proj ->
    proj.pluginManager.withPlugin("com.android.application") {
        if (proj.android?.buildFeatures != null) {
            proj.android.buildFeatures.buildConfig = true
        }
    }
    proj.pluginManager.withPlugin("com.android.library") {
        if (proj.android?.buildFeatures != null) {
            proj.android.buildFeatures.buildConfig = true
        }
        if (proj.name == "react-native-purchases") {
            if (!proj.android.hasProperty("namespace") || !proj.android.namespace) {
                proj.android.namespace = "com.revenuecat.purchases.react"
            }
        }
    }
}
